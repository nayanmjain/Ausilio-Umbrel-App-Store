version: "3.7"

services:
  app:
    image: calcom/cal.com:latest
    restart: on-failure
    ports:
      - "${APP_PORT}:3000"
    environment:
      - DATABASE_URL=postgresql://calcom:calcom_pass@db:5432/calcom
      - NEXTAUTH_SECRET=calcom_secret_key_12345
      - CALENDSO_ENCRYPTION_KEY=calcom_encryption_key_12345
      - NEXT_PUBLIC_WEBAPP_URL=http://localhost:${APP_PORT}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=calcom
      - POSTGRES_PASSWORD=calcom_pass
      - POSTGRES_DB=calcom
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
