version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ausilio-cal-diy_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: calcom/cal.com:latest
    restart: on-failure
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://calcom:calcom_password@db:5432/calcom
      - NEXTAUTH_SECRET=secret_key_change_me
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=calcom
      - POSTGRES_PASSWORD=calcom_password
      - POSTGRES_DB=calcom
    volumes:
      - ${APP_DATA_DIR}/db_data:/var/lib/postgresql/data
