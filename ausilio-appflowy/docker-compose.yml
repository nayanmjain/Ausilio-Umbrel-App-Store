version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ausilio-appflowy_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    image: appflowyio/appflowy_cloud:latest
    restart: on-failure
    environment:
      - PORT=80
      - APP_ENVIRONMENT=production
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
