version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ausilio-openseo_open-seo_1
      APP_PORT: 3001
      PROXY_AUTH_ADD: "false"

  open-seo:
    image: ghcr.io/every-app/open-seo:latest
    restart: on-failure
    environment:
      - PORT=3001
      - ALLOWED_HOST=${DEVICE_DOMAIN_NAME},${DEVICE_HOSTNAME},${APP_DOMAIN},${APP_HIDDEN_SERVICE}
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED=1
      - DO_NOT_TRACK=1
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BETTER_AUTH_SECRET=${APP_SEED}
      - VITE_SHOW_DEVTOOLS=false
    volumes:
      - ${APP_DATA_DIR}/data:/app/.wrangler
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s