services:
  app_proxy:
    environment:
      APP_HOST: ausilio-shlink_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    image: shlinkio/shlink:5.1.7
    restart: on-failure
    environment:
      - DEFAULT_DOMAIN=${DEVICE_DOMAIN_NAME}:8090
      - IS_HTTPS_ENABLED=false
      - DB_DRIVER=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=shlink
      - DB_USER=shlink
      - DB_PASSWORD=${APP_PASSWORD}
      - INITIAL_API_KEY=${APP_SHLINK_API_KEY}
      - PORT=8080
      - TIMEZONE=UTC
      - SKIP_INITIAL_GEOLITE_DOWNLOAD=true
      - ANONYMIZE_REMOTE_ADDR=true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/rest/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:15-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=shlink
      - POSTGRES_PASSWORD=${APP_PASSWORD}
      - POSTGRES_DB=shlink
    volumes:
      - ${APP_DATA_DIR}/db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlink"]
      interval: 10s
      timeout: 5s
      retries: 5
