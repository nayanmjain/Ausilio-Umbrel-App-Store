services:
  app_proxy:
    environment:
      APP_HOST: ausilio-erpnext_frontend_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  backend:
    image: frappe/erpnext:v16.36.1
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/sites:/home/frappe/frappe-bench/sites
      - ${APP_DATA_DIR}/data/logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${APP_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${APP_PASSWORD}
    depends_on:
      create-site:
        condition: service_completed_successfully

  configurator:
    image: frappe/erpnext:v16.36.1
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      REDIS_CACHE: erpnext-redis-cache:6379
      REDIS_QUEUE: erpnext-redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - ${APP_DATA_DIR}/data/sites:/home/frappe/frappe-bench/sites
      - ${APP_DATA_DIR}/data/logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:v16.36.1
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data/sites:/home/frappe/frappe-bench/sites
      - ${APP_DATA_DIR}/data/logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 300 erpnext-db:3306;
        wait-for-it -t 300 erpnext-redis-cache:6379;
        wait-for-it -t 300 erpnext-redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 300 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$SITE_ADMIN_PASSWORD --db-root-username=root --db-root-password=$$MYSQL_ROOT_PASSWORD --install-app erpnext --set-default frontend;
        fi;
    depends_on:
      configurator:
        condition: service_completed_successfully
      erpnext-db:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started
    environment:
      SITE_ADMIN_PASSWORD: ${APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${APP_PASSWORD}

  frontend:
    image: frappe/erpnext:v16.36.1
    restart: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - ${APP_DATA_DIR}/data/sites:/home/frappe/frappe-bench/sites
      - ${APP_DATA_DIR}/data/logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully
      backend:
        condition: service_started
      websocket:
        condition: service_started

  queue-long:
    image: frappe/erpnext:v16.36.1
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - ${APP_DATA_DIR}/data/sites:/home/frappe/frappe-bench/sites
      - ${APP_DATA_DIR}/data/logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-short:
    image: frappe/erpnext:v16.36.1
    restart: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - ${APP_DATA_DIR}/data/sites:/home/frappe/frappe-bench/sites
      - ${APP_DATA_DIR}/data/logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    image: frappe/erpnext:v16.36.1
    restart: on-failure
    command:
      - bench
      - schedule
    volumes:
      - ${APP_DATA_DIR}/data/sites:/home/frappe/frappe-bench/sites
      - ${APP_DATA_DIR}/data/logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:v16.36.1
    restart: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    volumes:
      - ${APP_DATA_DIR}/data/sites:/home/frappe/frappe-bench/sites
      - ${APP_DATA_DIR}/data/logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  erpnext-db:
    image: mariadb:11.8
    restart: on-failure
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${APP_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql

  erpnext-redis-cache:
    image: redis:7-alpine
    restart: on-failure

  erpnext-redis-queue:
    image: redis:7-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/redis-queue:/data
