version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ausilio-erpnext_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    image: frappe/erpnext:v15.11.0
    restart: on-failure
    environment:
      - BACKEND=backend:8000
      - FRAPPE_SITE_NAME_HEADER=frontend
      - SOCKETIO_PORT=9000
    depends_on:
      - db
      - redis-cache
      - redis-queue

  db:
    image: mariadb:10.11
    restart: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=erpnext_root_pass
    volumes:
      - ${APP_DATA_DIR}/db_data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: on-failure

  redis-queue:
    image: redis:7-alpine
    restart: on-failure
