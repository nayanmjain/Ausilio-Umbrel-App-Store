version: "3.7"

services:
  app:
    image: frappe/erpnext:v15.0.0
    restart: on-failure
    ports:
      - "${APP_PORT}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - MYSQL_ROOT_PASSWORD=erpnext_db_pass
      - MARIADB_ROOT_PASSWORD=erpnext_db_pass
    depends_on:
      - db
      - redis

  db:
    image: mariadb:10.6
    restart: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=erpnext_db_pass
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
