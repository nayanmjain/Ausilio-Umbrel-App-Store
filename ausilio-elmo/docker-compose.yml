services:
  app_proxy:
    environment:
      APP_HOST: ausilio-elmo_web_1
      APP_PORT: 3000
      # Elmo has its own email/password auth; do not stack Umbrel basic auth.
      PROXY_AUTH_ADD: "false"

  # TanStack Start dashboard, REST API, and MCP endpoint.
  web:
    image: elmohq/elmo-web:0.7.7
    restart: unless-stopped
    environment:
      - DEPLOYMENT_MODE=local
      - APP_URL=${APP_ELMO_APP_URL:-http://localhost:8096}
      - BETTER_AUTH_SECRET=${APP_ELMO_BETTER_AUTH_SECRET}
      - BETTER_AUTH_TRUSTED_ORIGINS=${APP_ELMO_BETTER_AUTH_TRUSTED_ORIGINS}
      - ELMO_ENCRYPTION_KEY=${APP_ELMO_ENCRYPTION_KEY}
      - DATABASE_URL=postgres://postgres:${APP_ELMO_DB_PASSWORD}@postgres:5432/elmo
      - DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - SCRAPE_TARGETS=${APP_ELMO_SCRAPE_TARGETS:-}
      - OPENROUTER_API_KEY=${APP_ELMO_OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${APP_ELMO_OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${APP_ELMO_ANTHROPIC_API_KEY:-}
      - MISTRAL_API_KEY=${APP_ELMO_MISTRAL_API_KEY:-}
      - BRIGHTDATA_API_TOKEN=${APP_ELMO_BRIGHTDATA_API_TOKEN:-}
      - CLORO_API_KEY=${APP_ELMO_CLORO_API_KEY:-}
      - SEARCHAPI_API_KEY=${APP_ELMO_SEARCHAPI_API_KEY:-}
      - OLOSTEP_API_KEY=${APP_ELMO_OLOSTEP_API_KEY:-}
      - OXYLABS_USERNAME=${APP_ELMO_OXYLABS_USERNAME:-}
      - OXYLABS_PASSWORD=${APP_ELMO_OXYLABS_PASSWORD:-}
      - DATAFORSEO_LOGIN=${APP_ELMO_DATAFORSEO_LOGIN:-}
      - DATAFORSEO_PASSWORD=${APP_ELMO_DATAFORSEO_PASSWORD:-}
      - TYPESAFE_API_KEY=${APP_ELMO_TYPESAFE_API_KEY:-}
      - JINA_API_KEY=${APP_ELMO_JINA_API_KEY:-}
      - REPROCESS_DAYS=${APP_ELMO_REPROCESS_DAYS:-}
      - ONBOARDING_LLM_TARGET=${APP_ELMO_ONBOARDING_LLM_TARGET:-}
      - RUNS_PER_PROMPT=${APP_ELMO_RUNS_PER_PROMPT:-}
      - DEFAULT_DELAY_HOURS=${APP_ELMO_DEFAULT_DELAY_HOURS:-}
      - ELMO_ENCRYPTION_KEY_OLD=${APP_ELMO_ENCRYPTION_KEY_OLD:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Background scheduler/worker. It exits when no Jev key (TypeSafe or
  # OpenRouter) or no usable SCRAPE_TARGETS is configured, so keep the retry
  # budget small; a restart from Umbrel picks up config.env changes.
  worker:
    image: elmohq/elmo-worker:0.7.7
    restart: "on-failure:5"
    stop_grace_period: 35s
    environment:
      - DEPLOYMENT_MODE=local
      - APP_URL=${APP_ELMO_APP_URL:-http://localhost:8096}
      - BETTER_AUTH_SECRET=${APP_ELMO_BETTER_AUTH_SECRET}
      - BETTER_AUTH_TRUSTED_ORIGINS=${APP_ELMO_BETTER_AUTH_TRUSTED_ORIGINS}
      - ELMO_ENCRYPTION_KEY=${APP_ELMO_ENCRYPTION_KEY}
      - DATABASE_URL=postgres://postgres:${APP_ELMO_DB_PASSWORD}@postgres:5432/elmo
      - DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - SCRAPE_TARGETS=${APP_ELMO_SCRAPE_TARGETS:-}
      - OPENROUTER_API_KEY=${APP_ELMO_OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${APP_ELMO_OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${APP_ELMO_ANTHROPIC_API_KEY:-}
      - MISTRAL_API_KEY=${APP_ELMO_MISTRAL_API_KEY:-}
      - BRIGHTDATA_API_TOKEN=${APP_ELMO_BRIGHTDATA_API_TOKEN:-}
      - CLORO_API_KEY=${APP_ELMO_CLORO_API_KEY:-}
      - SEARCHAPI_API_KEY=${APP_ELMO_SEARCHAPI_API_KEY:-}
      - OLOSTEP_API_KEY=${APP_ELMO_OLOSTEP_API_KEY:-}
      - OXYLABS_USERNAME=${APP_ELMO_OXYLABS_USERNAME:-}
      - OXYLABS_PASSWORD=${APP_ELMO_OXYLABS_PASSWORD:-}
      - DATAFORSEO_LOGIN=${APP_ELMO_DATAFORSEO_LOGIN:-}
      - DATAFORSEO_PASSWORD=${APP_ELMO_DATAFORSEO_PASSWORD:-}
      - TYPESAFE_API_KEY=${APP_ELMO_TYPESAFE_API_KEY:-}
      - JINA_API_KEY=${APP_ELMO_JINA_API_KEY:-}
      - REPROCESS_DAYS=${APP_ELMO_REPROCESS_DAYS:-}
      - ONBOARDING_LLM_TARGET=${APP_ELMO_ONBOARDING_LLM_TARGET:-}
      - RUNS_PER_PROMPT=${APP_ELMO_RUNS_PER_PROMPT:-}
      - DEFAULT_DELAY_HOURS=${APP_ELMO_DEFAULT_DELAY_HOURS:-}
      - ELMO_ENCRYPTION_KEY_OLD=${APP_ELMO_ENCRYPTION_KEY_OLD:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # One-shot Drizzle migration runner, re-run on every image upgrade.
  db-migrate:
    image: elmohq/elmo-db-migrate:0.7.7
    restart: "no"
    environment:
      DATABASE_URL: postgres://postgres:${APP_ELMO_DB_PASSWORD}@postgres:5432/elmo
    depends_on:
      postgres:
        condition: service_healthy

  # Bundled database. Postgres 18 keeps PGDATA in a version-specific child
  # directory, so the volume is mounted one level up at /var/lib/postgresql.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_ELMO_DB_PASSWORD}
      POSTGRES_DB: elmo
    volumes:
      - ${APP_DATA_DIR}/postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elmo"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
