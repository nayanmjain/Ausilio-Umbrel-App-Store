version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ausilio-fluidvoice_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    image: fluidvoice/fluidvoice:latest
    restart: on-failure
    environment:
      - PORT=8080
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
