id: ausilio-baserow
name: Baserow
category: productivity
version: "2.4.0"
tagline: Open-source no-code database and Airtable alternative
description: >-
  Baserow is an open-source online database: build tables, grid, kanban,
  calendar and form views, collaborate in realtime, and automate with a REST
  API and webhooks, all from your browser. This package runs the official
  all-in-one image (embedded Postgres and Redis behind Caddy); all data
  persists in the app data directory.


  Open the app and create the first account - it claims instance ownership
  (admin). No SMTP server is configured, so email invites and password resets
  will not send. Needs 2GB+ RAM.
