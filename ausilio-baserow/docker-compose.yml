services:
  app_proxy:
    environment:
      APP_HOST: ausilio-baserow_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    image: baserow/baserow:2.4.0
    restart: on-failure
    environment:
      - BASEROW_PUBLIC_URL=http://${DEVICE_DOMAIN_NAME}:8092
      - BASEROW_CADDY_ADDRESSES=:80
      # Accept hostname, app domain, and LAN IPs too, otherwise Baserow shows
      # "Site not found" when the browser URL host differs from PUBLIC_URL.
      - BASEROW_EXTRA_PUBLIC_URLS=${APP_BASEROW_EXTRA_PUBLIC_URLS}
      - BASEROW_EXTRA_ALLOWED_HOSTS=${APP_BASEROW_EXTRA_HOSTS}
      - MIGRATE_ON_STARTUP=true
      # Single celery worker + minimal mode keeps memory use down on small servers.
      - BASEROW_AMOUNT_OF_WORKERS=1
      - BASEROW_RUN_MINIMAL=yes
    volumes:
      - ${APP_DATA_DIR}/data:/baserow/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/80'"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First boot applies DB migrations and syncs templates; can take minutes.
      start_period: 180s
