services:
  app_proxy:
    environment:
      APP_HOST: ausilio-ansvisor_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/ansvisor/ansvisor/server:0.3.0
    restart: on-failure
    environment:
      - NODE_ENV=production
      - PORT=80
      - SUPABASE_URL=${APP_ANSIVISOR_SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${APP_ANSIVISOR_SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${APP_ANSIVISOR_SUPABASE_SERVICE_ROLE_KEY:-}
      - OPENAI_API_KEY=${APP_ANSIVISOR_OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${APP_ANSIVISOR_ANTHROPIC_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${APP_ANSIVISOR_GOOGLE_GENERATIVE_AI_API_KEY:-}
      - ALLOWED_ORIGINS=http://${DEVICE_DOMAIN_NAME}:8093
      - IS_CLOUD=false
      - CRON_SECRET=${APP_ANSIVISOR_CRON_SECRET}
      - CLORO_API_KEY=${APP_ANSIVISOR_CLORO_API_KEY:-}
      - CLORO_WEBHOOK_URL=${APP_ANSIVISOR_CLORO_WEBHOOK_URL:-}
      - PLATFORM_PROVIDER=cloro
      - AI_VOLUME_MULTIPLIER=0.45
      - AUDIT_LLM_MODEL=google/gemini-3-flash-preview
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/ansvisor/ansvisor/web:0.3.0
    restart: on-failure
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${APP_ANSIVISOR_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${APP_ANSIVISOR_SUPABASE_ANON_KEY:-}
      - OPENAI_API_KEY=${APP_ANSIVISOR_OPENAI_API_KEY:-}
      - GOOGLE_GEMINI_API_KEY=${APP_ANSIVISOR_GOOGLE_GENERATIVE_AI_API_KEY:-}
      - ANTHROPIC_API_KEY=${APP_ANSIVISOR_ANTHROPIC_API_KEY:-}
      - NEXT_PUBLIC_APP_URL=http://${DEVICE_DOMAIN_NAME}:8093
      - NEXT_PUBLIC_API_URL=http://${DEVICE_DOMAIN_NAME}:8093
      - NEXT_PUBLIC_IS_CLOUD=false
      - ANSVISOR_ENCRYPTION_KEY=${APP_ANSIVISOR_ENCRYPTION_KEY:-}
      - NEXT_PUBLIC_CONTENT_QUALITY_PHASE=${APP_ANSIVISOR_CONTENT_QUALITY_PHASE:-}
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
